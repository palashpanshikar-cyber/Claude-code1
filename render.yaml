# Render blueprint. Point Render at this repo and it reads this file
# instead of asking you to fill the settings in by hand.
#
# Configured for the FREE tier. Free instances get no persistent disk, so
# the container filesystem — and the JSON data file in it — is rebuilt on
# every deploy and every wake from idle.
#
# RECOMMENDED: add a free managed Postgres and your data survives anyway.
# Create a database at neon.tech or supabase.com, then set DATABASE_URL in
# Render's dashboard (Environment tab) to its connection string. The app
# switches stores on its own, creates its tables on boot, and keeps your
# gyms across restarts — no paid instance needed. Then delete the
# SEED_ON_EMPTY entry below, since there is no longer anything to repopulate.
#
# Without DATABASE_URL, SEED_ON_EMPTY keeps a woken instance from serving a
# blank app, but anything you added through /admin is gone and device keys
# are reissued. See DEPLOYMENT.md.
#
# Free instances also spin down when idle and take tens of seconds to wake.
# That is independent of where the data lives; `plan: starter` removes it.

services:
  - type: web
    name: gympulse
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Generated once by Render and kept secret. Read it from the
      # dashboard, then paste it into the app's /admin screen.
      - key: ADMIN_TOKEN
        generateValue: true

      # Set this in the dashboard rather than here — a connection string
      # contains a password and does not belong in git. Declared with
      # sync: false so Render prompts for it instead of storing a value.
      - key: DATABASE_URL
        sync: false

      # Only useful while DATABASE_URL is unset. Remove it once you have a
      # database, so the app keeps your real gyms instead of repopulating
      # demo ones.
      - key: SEED_ON_EMPTY
        value: "true"
